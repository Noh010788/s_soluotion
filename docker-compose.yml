services:
  db:
    image: postgres:16
    container_name: s_solution_odoo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: s_solution_odoo_local:18.0
    container_name: s_solution_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf.example:/etc/odoo/odoo.conf:ro
      - ./web:/mnt/extra-addons/web:ro
      - ./custom_addon:/mnt/extra-addons/custom_addon:ro

volumes:
  odoo-db-data:
  odoo-web-data:

